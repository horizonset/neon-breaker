<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Brick Breaker — Free Browser Arcade Game | HorizonSet</title>
  <meta name="description" content="Play Neon Brick Breaker free in your browser. Smooth 60fps arcade action with mouse, touch, or keyboard controls, glowing particles, and high-score tracking.">
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

    body {
      background: #070b14;
      color: #e2e8f0;
      margin: 0;
      min-height: 100vh;
      padding: 22px 14px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
      position: relative;
      user-select: none;
    }

    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.36;
      z-index: 0;
      pointer-events: none;
      will-change: transform;
      animation: floatOrb 16s ease-in-out infinite alternate;
    }
    .orb-1 { width: 340px; height: 340px; background: #7c3aed; top: -90px; left: -90px; }
    .orb-2 { width: 320px; height: 320px; background: #0ea5e9; bottom: -70px; right: -70px; animation-delay: -8s; }
    @keyframes floatOrb {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      100% { transform: translate3d(35px, 25px, 0) scale(1.08); }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 560px;
      background: rgba(17, 24, 39, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.09);
      padding: 22px;
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      animation: fadeUp 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translate3d(0, 14px, 0); }
      to { opacity: 1; transform: translate3d(0, 0, 0); }
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 600;
      color: #c4b5fd;
      background: rgba(124, 58, 237, 0.16);
      border: 1px solid rgba(167, 139, 250, 0.25);
      padding: 5px 12px;
      border-radius: 999px;
    }
    .badge-dot { width: 7px; height: 7px; border-radius: 50%; background: #34d399; box-shadow: 0 0 8px #34d399; }

    button.snd-toggle {
      background: rgba(51, 65, 85, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    button.snd-toggle:hover { background: rgba(71, 85, 105, 0.9); }

    h1 {
      margin: 0 0 4px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #f8fafc, #93c5fd, #c4b5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.sub { margin: 0 0 14px; font-size: 13px; color: #94a3b8; }

    .hud {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .hud-box {
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 11px;
      padding: 8px;
      text-align: center;
    }
    .hud-val { font-size: 18px; font-weight: 800; color: #38bdf8; }
    .hud-val.best { color: #34d399; }
    .hud-val.lives { color: #fb7185; }
    .hud-lbl { font-size: 11px; color: #94a3b8; margin-top: 1px; }

    .stage {
      position: relative;
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(56, 189, 248, 0.22);
      background: #050811;
      box-shadow: inset 0 0 30px rgba(2, 132, 199, 0.12);
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      touch-action: none;
      cursor: crosshair;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(7, 11, 20, 0.72);
      backdrop-filter: blur(5px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      transition: opacity 0.2s ease;
    }
    .overlay.hidden { opacity: 0; pointer-events: none; }
    .overlay h2 { margin: 0 0 6px; font-size: 26px; color: #f8fafc; }
    .overlay p { margin: 0 0 18px; font-size: 14px; color: #94a3b8; }

    .play-btn {
      background: linear-gradient(135deg, #7c3aed, #0284c7);
      color: #ffffff;
      border: 1px solid rgba(196, 181, 253, 0.4);
      padding: 12px 28px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 22px rgba(124, 58, 237, 0.45);
      transition: transform 0.15s ease;
    }
    .play-btn:hover { transform: translateY(-2px) scale(1.02); }
    .play-btn:active { transform: scale(0.97); }

    .hint-bar {
      margin-top: 12px;
      text-align: center;
      font-size: 12px;
      color: #64748b;
    }

    @media (max-width: 500px) {
      .container { padding: 15px; }
      .hud-val { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <div class="container">
    <div class="top-row">
      <div class="badge"><span class="badge-dot"></span> HorizonSet &bull; Arcade</div>
      <button class="snd-toggle" id="sndBtn" onclick="toggleSound()">Sound: On</button>
    </div>
    <h1>Neon Brick Breaker</h1>
    <p class="sub">Move mouse, drag finger, or use Arrow keys to bounce the ball and clear every brick.</p>

    <div class="hud">
      <div class="hud-box"><div class="hud-val" id="scoreEl">0</div><div class="hud-lbl">Score</div></div>
      <div class="hud-box"><div class="hud-val best" id="bestEl">0</div><div class="hud-lbl">Best</div></div>
      <div class="hud-box"><div class="hud-val" id="levelEl">1</div><div class="hud-lbl">Level</div></div>
      <div class="hud-box"><div class="hud-val lives" id="livesEl">3</div><div class="hud-lbl">Lives</div></div>
    </div>

    <div class="stage">
      <canvas id="game" width="480" height="520"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="ovTitle">Neon Brick Breaker</h2>
        <p id="ovSub">Click below or press Space to launch!</p>
        <button class="play-btn" id="ovBtn" onclick="handleOverlayClick()">Start Game</button>
      </div>
    </div>

    <div class="hint-bar">Controls: Mouse / Touch Drag / Left &amp; Right Arrows &bull; Space to Launch</div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    const overlay = document.getElementById('overlay');
    const ovTitle = document.getElementById('ovTitle');
    const ovSub = document.getElementById('ovSub');
    const ovBtn = document.getElementById('ovBtn');
    const scoreEl = document.getElementById('scoreEl');
    const bestEl = document.getElementById('bestEl');
    const levelEl = document.getElementById('levelEl');
    const livesEl = document.getElementById('livesEl');

    let bestScore = 0;
    try { bestScore = parseInt(localStorage.getItem('hs_breaker_best') || '0', 10) || 0; } catch (e) {}
    bestEl.textContent = bestScore;

    let soundOn = true;
    let audioCtx = null;

    function toggleSound() {
      soundOn = !soundOn;
      document.getElementById('sndBtn').textContent = 'Sound: ' + (soundOn ? 'On' : 'Off');
    }

    function playTone(freq, dur, type = 'sine', vol = 0.08) {
      if (!soundOn) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(vol, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur + 0.02);
      } catch (e) {}
    }

    // Game state
    let state = 'menu'; // menu | ready | playing | gameover
    let score = 0;
    let level = 1;
    let lives = 3;

    const paddle = { w: 94, h: 12, x: (W - 94) / 2, y: H - 34, speed: 7.5 };
    const ball = { x: W / 2, y: H - 46, r: 7, speed: 5.4, dx: 0, dy: 0 };
    const keys = { left: false, right: false };

    let bricks = [];
    let particles = [];
    const rowColors = ['#c084fc', '#818cf8', '#38bdf8', '#34d399', '#fbbf24', '#fb7185'];

    function buildBricks() {
      bricks = [];
      const rows = Math.min(7, 4 + Math.floor((level + 1) / 2));
      const cols = 7;
      const pad = 8;
      const sideMargin = 18;
      const topOffset = 46;
      const bw = (W - sideMargin * 2 - pad * (cols - 1)) / cols;
      const bh = 20;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          bricks.push({
            x: sideMargin + c * (bw + pad),
            y: topOffset + r * (bh + pad),
            w: bw,
            h: bh,
            color: rowColors[r % rowColors.length],
            alive: true
          });
        }
      }
    }

    function resetBallOnPaddle() {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - ball.r - 1;
      ball.dx = 0;
      ball.dy = 0;
      state = 'ready';
    }

    function launchBall() {
      if (state !== 'ready') return;
      const angle = (Math.random() * 0.5 - 0.25); // gentle random start angle
      const spd = 5.4 + (level - 1) * 0.38;
      ball.speed = Math.min(9.2, spd);
      ball.dx = ball.speed * Math.sin(angle);
      ball.dy = -ball.speed * Math.cos(angle);
      state = 'playing';
      playTone(440, 0.08, 'triangle', 0.09);
    }

    function updateHud() {
      scoreEl.textContent = score;
      levelEl.textContent = level;
      livesEl.textContent = lives;
      if (score > bestScore) {
        bestScore = score;
        bestEl.textContent = bestScore;
        try { localStorage.setItem('hs_breaker_best', String(bestScore)); } catch (e) {}
      }
    }

    function startNewGame() {
      score = 0;
      level = 1;
      lives = 3;
      particles = [];
      paddle.x = (W - paddle.w) / 2;
      buildBricks();
      resetBallOnPaddle();
      updateHud();
      overlay.classList.add('hidden');
      launchBall();
    }

    function handleOverlayClick() {
      if (state === 'menu' || state === 'gameover') {
        startNewGame();
      } else if (state === 'ready') {
        overlay.classList.add('hidden');
        launchBall();
      }
    }

    function spawnParticles(x, y, color) {
      for (let i = 0; i < 8; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 1.2 + Math.random() * 2.8;
        particles.push({
          x, y,
          dx: Math.cos(ang) * spd,
          dy: Math.sin(ang) * spd,
          life: 1,
          color
        });
      }
    }

    // Input handlers
    function movePaddleTo(clientX) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = W / rect.width;
      const cx = (clientX - rect.left) * scaleX;
      paddle.x = Math.max(0, Math.min(W - paddle.w, cx - paddle.w / 2));
      if (state === 'ready') ball.x = paddle.x + paddle.w / 2;
    }

    canvas.addEventListener('mousemove', e => {
      if (state === 'playing' || state === 'ready') movePaddleTo(e.clientX);
    });
    canvas.addEventListener('click', () => {
      if (state === 'ready') launchBall();
    });
    canvas.addEventListener('touchstart', e => {
      if (e.touches[0]) movePaddleTo(e.touches[0].clientX);
      if (state === 'ready') launchBall();
    }, { passive: true });
    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      if (e.touches[0]) movePaddleTo(e.touches[0].clientX);
    }, { passive: false });

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
      if (e.key === ' ') {
        if (state === 'ready') { e.preventDefault(); launchBall(); }
        else if (state === 'menu' || state === 'gameover') { e.preventDefault(); startNewGame(); }
      }
    });
    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
    });

    function update(dt) {
      if (keys.left) paddle.x = Math.max(0, paddle.x - paddle.speed * dt);
      if (keys.right) paddle.x = Math.min(W - paddle.w, paddle.x + paddle.speed * dt);
      if (state === 'ready') {
        ball.x = paddle.x + paddle.w / 2;
        ball.y = paddle.y - ball.r - 1;
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.dx * dt;
        p.y += p.dy * dt;
        p.life -= 0.045 * dt;
        if (p.life <= 0) particles.splice(i, 1);
      }

      if (state !== 'playing') return;

      ball.x += ball.dx * dt;
      ball.y += ball.dy * dt;

      // Wall bounces
      if (ball.x - ball.r <= 0) { ball.x = ball.r; ball.dx = Math.abs(ball.dx); playTone(260, 0.04); }
      if (ball.x + ball.r >= W) { ball.x = W - ball.r; ball.dx = -Math.abs(ball.dx); playTone(260, 0.04); }
      if (ball.y - ball.r <= 0) { ball.y = ball.r; ball.dy = Math.abs(ball.dy); playTone(300, 0.04); }

      // Paddle bounce
      if (ball.dy > 0 &&
          ball.y + ball.r >= paddle.y &&
          ball.y - ball.r <= paddle.y + paddle.h &&
          ball.x >= paddle.x - ball.r &&
          ball.x <= paddle.x + paddle.w + ball.r) {
        const rel = Math.max(-0.92, Math.min(0.92, (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2)));
        const angle = rel * (Math.PI / 3);
        ball.dx = ball.speed * Math.sin(angle);
        ball.dy = -ball.speed * Math.cos(angle);
        ball.y = paddle.y - ball.r - 0.5;
        playTone(480, 0.06, 'triangle', 0.08);
      }

      // Brick collisions
      let remaining = 0;
      let hitThisFrame = false;
      for (const b of bricks) {
        if (!b.alive) continue;
        remaining++;
        if (hitThisFrame) continue;

        const closestX = Math.max(b.x, Math.min(ball.x, b.x + b.w));
        const closestY = Math.max(b.y, Math.min(ball.y, b.y + b.h));
        const distX = ball.x - closestX;
        const distY = ball.y - closestY;

        if (distX * distX + distY * distY <= ball.r * ball.r) {
          b.alive = false;
          remaining--;
          hitThisFrame = true;

          const overlapX = Math.min(Math.abs(ball.x - b.x), Math.abs(ball.x - (b.x + b.w)));
          const overlapY = Math.min(Math.abs(ball.y - b.y), Math.abs(ball.y - (b.y + b.h)));
          if (overlapX < overlapY) ball.dx = -ball.dx;
          else ball.dy = -ball.dy;

          score += 10 * level;
          updateHud();
          spawnParticles(b.x + b.w / 2, b.y + b.h / 2, b.color);
          playTone(540 + (score % 240), 0.06, 'sine', 0.08);
        }
      }

      // Level cleared
      if (remaining === 0) {
        level++;
        score += 100;
        updateHud();
        buildBricks();
        resetBallOnPaddle();
        playTone(660, 0.14, 'triangle', 0.1);
        setTimeout(() => playTone(880, 0.18, 'triangle', 0.1), 110);
        return;
      }

      // Missed ball
      if (ball.y - ball.r > H) {
        lives--;
        updateHud();
        playTone(170, 0.22, 'sawtooth', 0.07);
        if (lives <= 0) {
          state = 'gameover';
          ovTitle.textContent = 'Game Over';
          ovSub.textContent = `Final Score: ${score} (Level ${level})`;
          ovBtn.textContent = 'Play Again';
          overlay.classList.remove('hidden');
        } else {
          resetBallOnPaddle();
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // Subtle background grid
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.04)';
      ctx.lineWidth = 1;
      for (let x = 40; x < W; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      }
      for (let y = 40; y < H; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }

      // Bricks
      for (const b of bricks) {
        if (!b.alive) continue;
        ctx.fillStyle = b.color;
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.roundRect(b.x, b.y, b.w, b.h, 5);
        ctx.fill();
      }
      ctx.shadowBlur = 0;

      // Particles
      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 2.5, p.y - 2.5, 5, 5);
      }
      ctx.globalAlpha = 1;

      // Paddle
      const pGrad = ctx.createLinearGradient(paddle.x, 0, paddle.x + paddle.w, 0);
      pGrad.addColorStop(0, '#818cf8');
      pGrad.addColorStop(1, '#38bdf8');
      ctx.fillStyle = pGrad;
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Ball
      ctx.fillStyle = '#f8fafc';
      ctx.shadowColor = '#7dd3fc';
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      if (state === 'ready') {
        ctx.fillStyle = 'rgba(148, 163, 184, 0.85)';
        ctx.font = '600 13px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Click / Tap or Press Space to Launch', W / 2, H / 2 + 40);
      }
    }

    buildBricks();
    let lastTime = performance.now();
    function loop(now) {
      const dt = Math.min((now - lastTime) / 16.667, 2.2);
      lastTime = now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
